<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- 換算規則（115學年度第1學期 專45期 基礎體能訓練 換算表） ---------- */
const STD = {
  jump:    { M: 200, F: 145 },          // 一上 立定跳遠 60 分門檻（公分）
  run:     { M: 5*60+50, F: 6*60+20 },  // 一上 1200m 60 分門檻（秒）
  shuttle: { M: 30, F: 27 },            // 一下 6公尺90秒折返跑 60 分門檻（次）
  run3000: { M: 15*60, F: 17*60 }       // 一下 3000m 60 分門檻（秒）
};
// 折返跑：每多 1 次加 3 分（最高 100）；少 1 次 59 分，之後每少 1 次減 3 分（最低 0）——依換算表
function shuttleScore(n, g){
  if (n === null || n === undefined || n === '' || isNaN(n)) return null;
  const d = Math.floor(Number(n)) - STD.shuttle[g==='F'?'F':'M'];
  if (d >= 0) return Math.min(100, 60 + 3*d);
  if (d === -1) return 59;
  return Math.max(0, 60 - 3*(-d - 1));
}
// 3000m：每快 5 秒加 1 分、每慢 5 秒減 1 分，未滿 5 秒按比例；0–100
function run3000Score(min, sec, g){
  if ((min === '' || min == null) && (sec === '' || sec == null)) return null;
  const t = (Number(min)||0)*60 + (Number(sec)||0);
  if (!t) return null;
  const lim = STD.run3000[g==='F'?'F':'M'];
  return Math.max(0, Math.min(100, round2(60 + (lim - t)/5)));
}
// 立定跳遠：門檻=60；每 +1cm 加 2 分至 80（+10cm）；之後每 +1cm 加 1 分，最高 100；未達門檻 0 分
function jumpScore(cm, g){
  if (cm === null || cm === undefined || cm === '' || isNaN(cm)) return null;
  const d = Math.floor(Number(cm)) - STD.jump[g==='F'?'F':'M'];
  if (d < 0) return 0;
  if (d <= 10) return 60 + 2*d;
  return Math.min(100, 80 + (d - 10));
}
// 1200m：門檻=60；每快 2 秒加 1 分，未滿 2 秒按比例，最高 100；慢於門檻 0 分
function runScore(min, sec, g){
  if ((min === '' || min == null) && (sec === '' || sec == null)) return null;
  const t = (Number(min)||0)*60 + (Number(sec)||0);
  if (!t) return null;
  const lim = STD.run[g==='F'?'F':'M'];
  if (t > lim) return 0;
  return Math.min(100, round2(60 + (lim - t)/2));
}
function round2(x){ return Math.round(x*100)/100; }
function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }

// 各學期配分：rJump = 項目A（跳遠／折返跑）平時、rRun = 項目B（1200m／3000m）平時、rTeach = 老師評定
const DEFAULT_WS = {
  '1': { mid:30, fin:40, reg:30, rJump:40, rRun:40, rTeach:20 },
  '2': { mid:30, fin:40, reg:30, rJump:30, rRun:40, rTeach:30 },
};
function mergeWs(src){ const o={}; for (const k in DEFAULT_WS) o[k]={...DEFAULT_WS[k], ...((src&&src[k])||{})}; return o; }

const SCORERS = {
  jump:    (r,f,g)=>jumpScore(r[f], g),
  shuttle: (r,f,g)=>shuttleScore(r[f], g),
  run:     (r,f,g)=>runScore(r[f+'M'], r[f+'S'], g),
  run3000: (r,f,g)=>run3000Score(r[f+'M'], r[f+'S'], g),
};
const TIMED = { run:1, run3000:1 };
const SEMS = {
  '1': { label:'一上',
    A:{ name:'立定跳遠', kind:'jump', unit:'公分', hint:'輸入公分，男 200／女 145 公分為 60 分' },
    B:{ name:'1200m', kind:'run', mlen:1, hint:'輸入 4 位數時間，例如 0530 = 5分30秒；男 5分50秒／女 6分20秒為 60 分' },
    f:{ ap:'jp', am:'jm', bp:'rp', bf:'rf', t:'t', absM:'am', absF:'af' } },
  '2': { label:'一下',
    A:{ name:'折返跑', kind:'shuttle', unit:'次', hint:'輸入 90 秒內折返次數，男 30／女 27 次為 60 分' },
    B:{ name:'3000m', kind:'run3000', mlen:2, hint:'輸入 4 位數時間，例如 1530 = 15分30秒；男 15分00秒／女 17分00秒為 60 分' },
    f:{ ap:'sp', am:'sm', bp:'lp', bf:'lf', t:'t2', absM:'am2', absF:'af2' } },
};
const GRADE_FIELDS = ['g','jp','jm','rpM','rpS','rfM','rfS','t','am','af','sp','sm','lpM','lpS','lfM','lfS','t2','am2','af2'];
function events(sem){
  const S = SEMS[sem || state.sem], f = S.f;
  return [
    { id:'log', label:'上課紀錄', kind:'log' },
    { ...S.A, id:f.ap, label:S.A.name+'・平時', part:'平時成績' },
    { ...S.A, id:f.am, label:S.A.name+'・期中', part:'期中成績', absent:f.absM },
    { ...S.B, id:f.bp, label:S.B.name+'・平時', part:'平時成績' },
    { ...S.B, id:f.bf, label:S.B.name+'・期末', part:'期末成績', absent:f.absF },
    { id:f.t, label:'平時表現', kind:'teach', unit:'分', part:'平時成績' },
    { id:'sum', label:'總表', kind:'sum' },
    { id:'set', label:'配分設定', kind:'set' },
  ];
}
function curEvent(){ const ev = events(); return ev.find(e=>e.id===state.tab) || ev[0]; }
function evScore(ev, r){
  if (ev.kind==='teach') return num(r[ev.id]);
  if (ev.absent && r[ev.absent]) return 0;
  return SCORERS[ev.kind](r, ev.id, r.g);
}

function calc(r, w, sem){
  const S = SEMS[sem || state.sem], f = S.f;
  const ap = SCORERS[S.A.kind](r, f.ap, r.g);
  const am = r[f.absM] ? 0 : SCORERS[S.A.kind](r, f.am, r.g);
  const bp = SCORERS[S.B.kind](r, f.bp, r.g);
  const bf = r[f.absF] ? 0 : SCORERS[S.B.kind](r, f.bf, r.g);
  const t  = num(r[f.t]);
  const reg = (ap!=null && bp!=null && t!=null) ? round2((ap*w.rJump + bp*w.rRun + t*w.rTeach)/100) : null;
  const sem_ = (am!=null && bf!=null && reg!=null) ? round2((am*w.mid + bf*w.fin + reg*w.reg)/100) : null;
  return { ap, am, bp, bf, t, reg, sem: sem_, absM: !!r[f.absM], absF: !!r[f.absF] };
}

/* ---------- 狀態 ---------- */
const DEMO_KEY = 'demo';
const state = {
  classes: {},       // key -> {key, dept, cls, fileName, orig(b64|null), rows:[], updatedAt}
  current: DEMO_KEY,
  tab: 'log',
  sem: '1',
  lessons: {},      // id -> {id, cls, sem, date, topic, quiz, rec:{rowKey:{s,n}}, createdAt, updatedAt}
  lessonId: null,
  ws: mergeWs(null),
  get w(){ return this.ws[this.sem]; },
  store: null,       // 'db' | 'local' | null
};
// 尚未匯入任何班級時使用的空白占位（不顯示、不儲存）
state.classes[DEMO_KEY] = { key: DEMO_KEY, demo:true, dept:'', cls:'尚未匯入班級', fileName:null, orig:null, rows: [] };

/* ---------- 儲存（db 私人區 → localStorage 後備） ---------- */
let db=null, uid=null, saveTimer=null, dirty=new Set();
const LS='pe-grades-v1';
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
function lsSet(obj){ try{ localStorage.setItem(LS, JSON.stringify(obj)); return true; }catch(e){ return false; } }
function storableLessons(){ const o={}; for(const k in state.lessons) if(state.lessons[k].cls!==DEMO_KEY) o[k]=state.lessons[k]; return o; }
function lsSave(){ return lsSet({ classes: storableClasses(), lessons: storableLessons(), ws: state.ws, current: state.current, sem: state.sem }); }
function setStatus(t){ document.getElementById('status').textContent = t; }

function storableClasses(){ const o={}; for(const k in state.classes) if(!state.classes[k].demo) o[k]=state.classes[k]; return o; }

function scheduleSave(key){
  const c = state.classes[key];
  if (!c || c.demo){ setStatus('範例資料不會儲存'); return; }
  c.updatedAt = Date.now(); dirty.add(key);
  setStatus('儲存中…');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
async function flush(){
  const keys=[...dirty]; dirty.clear();
  lsSave();
  if (db && uid){
    try{
      for (const k of keys){
        if (k==='__settings') await db.collection('data/users/'+uid).doc('settings').set({ ws: state.ws });
        else if (k.startsWith('l_')){ if (state.lessons[k]) await db.collection('data/users/'+uid).doc(k).set(state.lessons[k]); else await db.collection('data/users/'+uid).doc(k).delete(); }
        else if (state.classes[k]) await db.collection('data/users/'+uid).doc(k).set(state.classes[k]);
      }
      setStatus('已儲存到你的帳號 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    }catch(e){ setStatus('雲端儲存失敗，已暫存在此瀏覽器（'+(e&&e.code||'錯誤')+'）'); }
  } else {
    setStatus(state.store==='local' ? '已儲存在這台裝置' : '已暫存');
  }
}
async function removeClass(key){
  delete state.classes[key];
  const gone = Object.keys(state.lessons).filter(k=>state.lessons[k].cls===key);
  gone.forEach(k=>delete state.lessons[k]);
  lsSave();
  if (db && uid){ try{ await db.collection('data/users/'+uid).doc(key).delete(); for (const k of gone) await db.collection('data/users/'+uid).doc(k).delete(); }catch(e){} }
}

async function initStore(){
  const local = lsGet();
  if (local){
    Object.assign(state.classes, local.classes||{});
    Object.assign(state.lessons, local.lessons||{});
    if (local.ws) state.ws = mergeWs(local.ws);
    else if (local.w) state.ws['1'] = { ...DEFAULT_WS['1'], ...local.w };
    if (local.sem && SEMS[local.sem]) { state.sem = local.sem; state.tab = events()[0].id; }
    state.store='local';
  }
  pickDefaultClass(local && local.current);
  renderAll();
  try{
    if (!window.claude || !window.claude.use) { setStatus(local?'已載入這台裝置的資料':'尚未匯入班級'); return; }
    const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!d || !u){ setStatus(local?'已載入這台裝置的資料':'資料存在這台裝置'); return; }
    const id = await u.id();
    if (!id){ setStatus('已載入這台裝置的資料'); return; }
    db=d; uid=id; state.store='db';
    const snap = await db.collection('data/users/'+uid).get();
    let remoteCount=0;
    snap.docs.forEach(doc=>{
      const v = doc.data(); if(!v) return;
      if (doc.id==='settings'){ if(v.ws) state.ws=mergeWs(v.ws); else if(v.w) state.ws['1']={...DEFAULT_WS['1'],...v.w}; return; }
      if (doc.id.startsWith('l_')){ const m=state.lessons[doc.id]; if (!m || (v.updatedAt||0) >= (m.updatedAt||0)) state.lessons[doc.id]=v; return; }
      const mine = state.classes[doc.id];
      if (!mine || (v.updatedAt||0) >= (mine.updatedAt||0)) state.classes[doc.id]=v;
      remoteCount++;
    });
    // 本機有、雲端沒有 → 上傳
    for (const k in storableClasses()){ if(!snap.docs.some(x=>x.id===k)) dirty.add(k); }
    for (const k in storableLessons()){ if(!snap.docs.some(x=>x.id===k)) dirty.add(k); }
    if (dirty.size) flush();
    pickDefaultClass(state.current);
    renderAll();
    setStatus(remoteCount ? '已從你的帳號載入 '+remoteCount+' 個班級' : '資料會保存在你的帳號（僅你看得到）');
  }catch(e){ setStatus('使用此瀏覽器儲存'); }
}
function pickDefaultClass(pref){
  const real = Object.keys(storableClasses());
  if (pref && state.classes[pref] && !(pref===DEMO_KEY && real.length)) state.current = pref;
  else if (!state.classes[state.current] || (state.current===DEMO_KEY && real.length)) state.current = real[0] || DEMO_KEY;
}

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cur(){ return state.classes[state.current]; }
function fmt(v){ return v==null ? '—' : (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/,'')); }

function renderAll(){ renderClassSel(); renderTabs(); renderMain(); }

function renderClassSel(){
  const sel = $('#classSel');
  let keys = Object.keys(storableClasses()).sort((a,b)=> state.classes[a].cls.localeCompare(state.classes[b].cls,'zh-Hant'));
  if (!keys.length){ sel.innerHTML = '<option value="demo">尚未匯入班級</option>'; return; }
  sel.innerHTML = keys.map(k=>`<option value="${esc(k)}" ${k===state.current?'selected':''}>${esc(state.classes[k].cls)}（${state.classes[k].rows.length}人）</option>`).join('');
}
function filled(ev, r){
  if (ev.kind==='sum' || ev.kind==='set' || ev.kind==='log') return false;
  if (ev.kind==='teach') return num(r[ev.id])!=null;
  if (ev.absent && r[ev.absent]) return true;
  return num(r[TIMED[ev.kind] ? ev.id+'M' : ev.id])!=null;
}
function renderTabs(){
  const c = cur();
  document.querySelectorAll('[data-sem]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sem===state.sem));
  $('#tabs').innerHTML = events().map(ev=>{
    let extra='';
    if (!c.demo && ev.kind!=='sum' && ev.kind!=='set' && ev.kind!=='log'){
      const n = c.rows.filter(r=>filled(ev,r)).length;
      extra = `<span class="pct">${n}/${c.rows.length}</span>`;
    }
    return `<button class="tab" role="tab" data-tab="${ev.id}" aria-selected="${state.tab===ev.id}">${ev.label}${extra}</button>`;
  }).join('');
}
function updateTabCount(evId){
  const ev = events().find(e=>e.id===evId); const c=cur();
  const el = document.querySelector(`.tab[data-tab="${evId}"] .pct`);
  if (el) el.textContent = c.rows.filter(r=>filled(ev,r)).length + '/' + c.rows.length;
  const p = document.getElementById('prog');
  if (p) p.textContent = '已登錄 ' + c.rows.filter(r=>filled(ev,r)).length + ' / ' + c.rows.length + ' 人';
}

function timeDigits(m, s){
  if (num(m)==null && num(s)==null) return '';
  const mm=Math.floor(Number(m)||0), ss=Math.floor(Number(s)||0);
  return String(mm).padStart(2,'0') + String(ss).padStart(2,'0');
}
function timePreview(m, s){
  if (num(m)==null && num(s)==null) return '';
  return `${Number(m)||0}分${String(Number(s)||0).padStart(2,'0')}秒`;
}
// 0530 → 5分30秒；530 → 5分30秒；1530 → 15分30秒
function parseTime(raw){
  const d=String(raw||'').replace(/\D/g,'').slice(0,4);
  if (d.length<3) return { d, ok:false, empty:!d.length };
  const m=parseInt(d.slice(0,-2),10), s=parseInt(d.slice(-2),10);
  if (s>=60) return { d, ok:false, err:'秒數要小於 60' };
  return { d, ok:true, m, s };
}
function sexSwitch(i, g){
  const f = g==='F';
  return `<button type="button" class="sex" data-sex="${i}" data-g="${f?'F':'M'}" title="點一下切換性別">${f?'女':'男'}</button>`;
}
function scorePill(v, absent){
  if (absent) return `<span class="score absent">缺考</span>`;
  if (v==null) return `<span class="score">—</span>`;
  return `<span class="score ${v===0?'zero':'pass'}">${fmt(v)}</span>`;
}

function renderMain(){
  const c = cur(), ev = curEvent(), m = $('#main');
  state.tab = ev.id;
  let html = '';
  if (c.demo && ev.kind!=='set'){
    m.innerHTML = `<div class="panel startbox"><h2>還沒有班級名冊</h2>
      <p>按上方班級選單右邊的「名冊」，選學校下載的成績繳交表（.xlsx），就會匯入整班學生，開始登錄成績和上課紀錄。</p>
      <p>換了新手機或電腦？按上方的「還原」選之前的備份檔（.json），資料就會回來。</p>
      <label class="btn primary" for="fileIn2">匯入名冊<input type="file" id="fileIn2" accept=".xlsx"></label></div>`;
    return;
  }
  if (ev.kind==='sum') html += renderSummary(c);
  else if (ev.kind==='set') html += renderSettings(c);
  else if (ev.kind==='log') html += renderLog(c);
  else html += renderEntry(c, ev);
  m.innerHTML = html;
}

function renderEntry(c, ev){
  const hint = ev.kind==='teach' ? '輸入老師評定的平時表現分數（0–100）' : ev.hint;
  const n = c.rows.filter(r=>filled(ev,r)).length;
  let h = `<div class="eventhead"><div><h2>${SEMS[state.sem].label}｜${ev.label}${pdfTools(ev)}</h2><p>${hint}・計入「${ev.part}」</p></div><span class="progress" id="prog">已登錄 ${n} / ${c.rows.length} 人</span></div>`;
  h += `<div class="list">`;
  c.rows.forEach((r,i)=>{
    let inputs='', ab = ev.absent ? !!r[ev.absent] : false;
    if (TIMED[ev.kind]){
      inputs = `<input type="text" inputmode="numeric" class="tin" maxlength="4" id="in-${ev.id}T-${i}" data-i="${i}" data-t="${ev.id}" value="${esc(timeDigits(r[ev.id+'M'], r[ev.id+'S']))}" placeholder="分秒" aria-label="${esc(r.name)} 時間（4 位數，例如 0530）" autocomplete="off" ${ab?'disabled':''}><span class="unit tprev" id="tp-${i}">${esc(timePreview(r[ev.id+'M'], r[ev.id+'S']))}</span>`;
    } else {
      inputs = `<input type="text" inputmode="decimal" class="wide" id="in-${ev.id}-${i}" data-i="${i}" data-f="${ev.id}" ${ev.kind==='teach'?'data-teach="1"':''} value="${esc(r[ev.id])}" aria-label="${esc(r.name)} ${ev.unit}" ${ab?'disabled':''}><span class="unit">${ev.unit}</span>`;
    }
    const sc = evScore(ev, r);
    if (ev.absent) inputs += `<label class="abs"><input type="checkbox" id="ab-${ev.id}-${i}" data-i="${i}" data-ab="${ev.absent}" ${ab?'checked':''}>缺考</label>`;
    h += `<div class="row" data-row="${i}">
      <div class="who"><span class="sid">${esc(r.sid)}</span><span class="name">${esc(r.name)}</span>
        ${sexSwitch(i, r.g)}</div>
      <div class="inputs">${inputs}</div>
      <div id="sc-${i}">${ev.kind==='teach' ? scorePill(sc==null?null:sc,false).replace(' pass','') : scorePill(sc, ab)}</div>
    </div>`;
  });
  return h + `</div>`;
}

function renderSummary(c){
  const w = state.w, S = SEMS[state.sem];
  let done = 0;
  let body = c.rows.map(r=>{
    const s = calc(r, w); if (s.sem!=null) done++;
    const td = v => `<td class="num ${v==null?'miss':''}">${fmt(v)}</td>`;
    return `<tr><td class="num">${esc(r.sid)}</td><td class="l">${esc(r.name)}</td><td>${sexSwitch(c.rows.indexOf(r), r.g)}</td>
      ${td(s.ap)}${td(s.bp)}${td(s.t)}<td class="num grp">${fmt(s.reg)}</td>
      <td class="num">${s.absM?'缺考':fmt(s.am)}</td><td class="num">${s.absF?'缺考':fmt(s.bf)}</td><td class="num final${s.sem!=null&&s.sem<60?' fail':''}">${fmt(s.sem)}</td></tr>`;
  }).join('');
  return `<div class="eventhead"><div><h2>${S.label}｜總表${pdfTools(curEvent())}</h2><p>學期 = 期中 ${w.mid}% + 期末 ${w.fin}% + 平時 ${w.reg}%；平時 = ${S.A.name}平時 ${w.rJump}% + ${S.B.name}平時 ${w.rRun}% + 表現 ${w.rTeach}%</p></div>
    <span class="progress">學期成績完成 ${done} / ${c.rows.length} 人</span></div>
    <div class="tablewrap"><table><thead><tr><th>學號</th><th>姓名</th><th>性別</th>
    <th class="grp">${S.A.name}平時</th><th>${S.B.name}平時</th><th>表現</th><th class="grp">平時成績</th>
    <th class="grp">期中<br>(${S.A.name})</th><th>期末<br>(${S.B.name})</th><th class="grp">學期成績</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="status">尚未填完的項目顯示「—」，匯出時該格留白。缺考以 0 分計算，並在「缺考」欄標記 Y。</p>`;
}

function renderSettings(c){
  const w=state.w, S=SEMS[state.sem];
  const s1=w.mid+w.fin+w.reg, s2=w.rJump+w.rRun+w.rTeach;
  const rules = state.sem==='1' ? `
     <p class="formula">立定跳遠 男 200 / 女 145 公分 = 60 分</p>
     <ul class="rules"><li>每多 1 公分加 2 分，到 <b>男 210／女 155 公分 = 80 分</b></li>
       <li>之後每多 1 公分加 1 分，<b>男 230／女 175 公分 = 100 分</b></li>
       <li>未達 60 分門檻以 0 分計；小數點公分無條件捨去</li></ul>
     <p class="formula" style="margin-top:12px">1200m 男 5分50秒 / 女 6分20秒 = 60 分</p>
     <ul class="rules"><li>每快 2 秒加 1 分，未滿 2 秒按比例（快 1 秒 = +0.5 分）</li>
       <li><b>男 4分30秒／女 5分00秒 = 100 分</b>（最高）</li>
       <li>慢於 60 分門檻以 0 分計</li></ul>` : `
     <p class="formula">折返跑（6公尺 90 秒）男 30 / 女 27 次 = 60 分</p>
     <ul class="rules"><li>每多 1 次加 3 分，<b>男 44／女 41 次 = 100 分</b>（最高）</li>
       <li>少 1 次 59 分，之後每少 1 次減 3 分，最低 0 分（男 10／女 7 次 = 3 分）</li></ul>
     <p class="formula" style="margin-top:12px">3000m 男 15分00秒 / 女 17分00秒 = 60 分</p>
     <ul class="rules"><li>每快 5 秒加 1 分，<b>男 11分40秒／女 13分40秒 = 100 分</b>（最高）</li>
       <li>每慢 5 秒減 1 分，<b>男 20分00秒／女 22分00秒 = 0 分</b></li>
       <li>未滿 5 秒按比例核算（1 秒 = 0.2 分）</li></ul>`;
  const inp=(k)=>`<input type="text" inputmode="decimal" id="w-${k}" data-w="${k}" value="${w[k]}">`;
  return `<div class="grid2">
   <div class="panel"><h2>${S.label}學期成績配分</h2><div class="wt">
     <span>期中考（${S.A.name}期中測驗）</span><span>${inp('mid')} %</span>
     <span>期末考（${S.B.name} 期末測驗）</span><span>${inp('fin')} %</span>
     <span>平時成績</span><span>${inp('reg')} %</span>
     <span class="sum ${s1!==100?'bad':''}" id="sum1">合計 ${s1}%${s1!==100?'，應為 100%':''}</span></div></div>
   <div class="panel"><h2>${S.label}平時成績組成</h2><div class="wt">
     <span>${S.A.name}平時測驗</span><span>${inp('rJump')} %</span>
     <span>${S.B.name} 平時測驗</span><span>${inp('rRun')} %</span>
     <span>老師評定平時表現</span><span>${inp('rTeach')} %</span>
     <span class="sum ${s2!==100?'bad':''}" id="sum2">合計 ${s2}%${s2!==100?'，應為 100%':''}</span></div>
     <div style="margin-top:10px"><button id="resetW">恢復預設</button></div></div>
   <div class="panel"><h2>${S.label}換算標準</h2>${rules}</div>
   <div class="panel"><h2>這個班級</h2>
     <p class="status" style="margin:0 0 10px">${esc(c.dept)}・${esc(c.cls)}・${c.rows.length} 人${c.fileName?'<br>來源檔案：'+esc(c.fileName):''}</p>
     ${c.demo?'<p class="status" style="margin:0">尚未匯入班級。</p>':'<div class="confirm"><button data-allg="M">全班設為男生</button><button data-allg="F">全班設為女生</button></div>'}
     ${c.demo?'':`<div class="confirm" style="margin-top:12px" id="delbox"><button class="danger" id="delAsk">刪除這個班級</button></div>`}
   </div>
   <div class="panel"><h2>資料備份・換裝置</h2>
     <p class="status" style="margin:0">要把成績搬到另一台手機或電腦：先在這台按上方的「備份」存成 .json 檔，再到另一台按「還原」選那個檔案。同一班以較新的資料為準。</p>
   </div></div>`;
}

/* ---------- 互動 ---------- */
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2600); }

document.addEventListener('click', e=>{
  const sb = e.target.closest('[data-sem]');
  if (sb){ if (sb.dataset.sem!==state.sem){
      const idx = events().findIndex(x=>x.id===state.tab);
      state.sem = sb.dataset.sem; state.tab = events()[Math.max(0,idx)].id;
      renderTabs(); renderMain(); lsSave();
      toast('已切換到'+SEMS[state.sem].label+'：'+SEMS[state.sem].A.name+'・'+SEMS[state.sem].B.name); }
    return; }
  const tab = e.target.closest('.tab');
  if (tab){ state.tab = tab.dataset.tab; renderTabs(); renderMain(); window.scrollTo({top:0}); return; }
  const sx = e.target.closest('[data-sex]');
  if (sx){ const i=+sx.dataset.sex, r=cur().rows[i];
    r.g = r.g==='F' ? 'M' : 'F'; scheduleSave(state.current);
    sx.dataset.g = r.g; sx.textContent = r.g==='F' ? '女' : '男';
    if (curEvent().kind==='sum') renderMain(); else refreshRow(i);
    return; }
  const ag = e.target.closest('[data-allg]');
  if (ag){ cur().rows.forEach(r=>r.g=ag.dataset.allg); scheduleSave(state.current); toast('已將全班設為'+(ag.dataset.allg==='F'?'女生':'男生')); return; }
  if (e.target.id==='resetW'){ state.ws[state.sem]={...DEFAULT_WS[state.sem]}; dirty.add('__settings'); scheduleSaveSettings(); renderMain(); return; }
  if (e.target.id==='delAsk'){ $('#delbox').innerHTML = `確定刪除「${esc(cur().cls)}」的所有成績？<button class="danger" id="delYes">刪除</button><button id="delNo">取消</button>`; return; }
  if (e.target.id==='delNo'){ renderMain(); return; }
  if (e.target.id==='delYes'){ const k=state.current; removeClass(k).then(()=>{ state.current=Object.keys(storableClasses())[0]||DEMO_KEY; renderAll(); toast('已刪除班級'); }); return; }
});

function scheduleSaveSettings(){
  dirty.add('__settings'); setStatus('儲存中…');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}

function refreshRow(i){
  const ev = curEvent(), r = cur().rows[i], box = document.getElementById('sc-'+i);
  if (!box) return;
  const ab = ev.absent ? !!r[ev.absent] : false;
  const sc = evScore(ev, r);
  box.innerHTML = ev.kind==='teach' ? scorePill(sc,false).replace(' pass','') : scorePill(sc, ab);
  updateTabCount(ev.id);
}

document.addEventListener('input', e=>{
  const t=e.target;
  if (t.dataset.t){
    const i=+t.dataset.i, r=cur().rows[i], f=t.dataset.t, p=parseTime(t.value);
    if (p.d!==t.value) t.value=p.d;
    const pv=document.getElementById('tp-'+i);
    if (p.ok){ r[f+'M']=String(p.m); r[f+'S']=String(p.s); if(pv){ pv.textContent=timePreview(p.m,p.s); pv.classList.remove('bad'); } }
    else { r[f+'M']=''; r[f+'S']=''; if(pv){ pv.textContent=p.err||''; pv.classList.toggle('bad', !!p.err); } }
    refreshRow(i); scheduleSave(state.current);
    if (p.ok && p.d.length===4) focusNextTime(t);
    return;
  }
  if (t.dataset.f){
    const i=+t.dataset.i; let v=t.value.trim().replace(/[^\d.]/g,'');
    if (t.dataset.teach && num(v)>100) v='100';
    if (v!==t.value) t.value=v;
    cur().rows[i][t.dataset.f]=v; refreshRow(i); scheduleSave(state.current);
    // 分鐘輸入完（1200m 1 位數、3000m 2 位數）自動跳到秒
    const ml = +t.dataset.mlen;
    if (ml && /^\d+$/.test(v) && v.length>=ml) { const nx=document.getElementById(t.id.replace(/M-/,'S-')); nx&&nx.focus(); nx&&nx.select(); }
  } else if (t.dataset.w){
    const v=num(t.value); state.w[t.dataset.w]= v==null?0:v;
    const w=state.w, s1=w.mid+w.fin+w.reg, s2=w.rJump+w.rRun+w.rTeach;

const HEAD = ['科系','班級','學籍號碼','學號','姓名','期中成績','期中缺考','期末成績','期末缺考','平時成績','學期成績'];
function b64(buf){ let s='', b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const bin=atob(s), b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
function keyFor(cls){ let h=0; for(const ch of cls) h=(h*31+ch.codePointAt(0))>>>0; return 'c_'+h.toString(36); }
function cellText(c){ const v=c.value; if (v==null) return ''; if (typeof v==='object'){ if (v.richText) return v.richText.map(x=>x.text).join(''); if ('result' in v) return String(v.result??''); if (v.text) return String(v.text); } return String(v); }

async function importRoster(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if (!window.ExcelJS){ toast('Excel 元件沒有載入，請重新整理頁面再試'); return; }
  try{
    const buf=await f.arrayBuffer();
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf.slice(0));
    const ws=wb.worksheets[0]; const col={};
    ws.getRow(1).eachCell((c,n)=>{ col[cellText(c).trim()]=n; });
    if (!col['姓名'] || !col['學號']) { toast('找不到「學號」「姓名」欄位，請確認是學校的成績繳交表'); return; }
    const rows=[];
    for (let r=2; r<=ws.rowCount; r++){
      const row=ws.getRow(r), g=k=> col[k]? cellText(row.getCell(col[k])).trim() : '';
      if (!g('姓名')) continue;
      rows.push({ dept:g('科系'), cls:g('班級'), reg:g('學籍號碼'), sid:g('學號'), name:g('姓名'), xr:r, g:'M' });
    }

    const cls = rows[0].cls || f.name.replace(/\.xlsx$/i,''), key=keyFor(cls);
    const old = state.classes[key];
    let kept=0;
    if (old && !old.demo){ // 重新匯入：保留已登錄的成績
      const byReg=new Map(old.rows.map(x=>[x.reg||x.sid, x]));
      rows.forEach(x=>{ const o=byReg.get(x.reg||x.sid); if(o){ for(const k of GRADE_FIELDS) if (o[k]!==undefined) x[k]=o[k]; kept++; } });
    }
    state.classes[key]={ key, dept:rows[0].dept, cls, fileName:f.name, orig:b64(buf), rows, updatedAt:Date.now() };
    state.current=key; state.tab=events()[0].id;
    scheduleSave(key); renderAll();
    toast(old&&!old.demo ? `已更新 ${cls} 名單，保留 ${kept} 位同學的成績` : `已匯入 ${cls}，共 ${rows.length} 人。性別預設為男，女生請點「男」切換`);
  }catch(err){ toast('讀取失敗：請選擇 .xlsx 成績繳交表'); }
}

/* ---------- 上課紀錄 PDF ---------- */
function wrapLines(g, text, maxW, maxLines){
  const out=[]; String(text||'').split('\n').forEach(par=>{
    let line=''; for (const ch of [...par]){ if (g.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; }
    out.push(line);
  });
  if (maxLines && out.length>maxLines){ const cut=out.slice(0,maxLines); let last=cut[maxLines-1]; while(last && g.measureText(last+'…').width>maxW) last=last.slice(0,-1); cut[maxLines-1]=last+'…'; return cut; }
  return out;
}

/* ---------- 存檔（Claude 內用 downloads；獨立 App 用分享或下載） ---------- */
async function saveFile(name, blob){
  if (downloads){ await downloads.save({ filename:name, data:blob }); return; }
  const file = (typeof File==='function') ? new File([blob], name, {type:blob.type}) : null;
  if (file && navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})){
    try{ await navigator.share({ files:[file], title:name }); return; }
    catch(e){ if (e && e.name==='AbortError') throw {code:'declined'}; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

    let lAdded=0;
    for (const k in (data.lessons||{})){
      const inc=data.lessons[k], mine=state.lessons[k];
      if (!mine || (inc.updatedAt||0) > (mine.updatedAt||0)){ state.lessons[k]=inc; dirty.add(k); lAdded++; }
    }
    if (data.ws){ state.ws = mergeWs(data.ws); dirty.add('__settings'); }
    flush(); pickDefaultClass(state.current); renderAll();
    toast(`已還原：新增 ${added} 班、更新 ${updated} 班` + (lAdded?`、上課紀錄 ${lAdded} 筆`:'') + (kept?`，${kept} 班這台較新已保留`:''));
  }catch(err){ toast('這不是體能成績的備份檔'); }
});

initStore();
</script>

try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if ('serviceWorker' in navigator && location.protocol==='https:') {
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
